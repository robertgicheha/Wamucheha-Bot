version: '3.8'
services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: trading-engine
    cpus: ${ENGINE_CPU}
    mem_limit: ${ENGINE_MEM}
    restart: unless-stopped
    env_file: .env
    volumes:
    - ./config:/app/config:ro
    - engine-data:/app/data
    - ml-models:/app/ml/saved_models
    environment:
      MT5_RPC_HOST: mt5
      PYTHONUNBUFFERED: '1'
    networks:
    - trading-net
    depends_on:
    - dashboard
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import requests; requests.get('http://dashboard:8000/health', timeout=5)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: trading-dashboard
    cpus: ${DASH_CPU}
    mem_limit: ${DASH_MEM}
    restart: unless-stopped
    env_file: .env
    ports:
    - 127.0.0.1:8000:8000
    volumes:
    - engine-data:/app/data:ro
    - ./config:/app/config:ro
    networks:
    - trading-net
  screener:
    build:
      context: .
      dockerfile: Dockerfile.screener
    container_name: trading-screener
    cpus: ${SCREENER_CPU}
    mem_limit: ${SCREENER_MEM}
    restart: unless-stopped
    env_file: .env
    volumes:
    - ./config:/app/config:ro
    - screener-data:/app/data
    networks:
    - trading-net
  watchdog:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: trading-watchdog
    cpus: ${WATCHDOG_CPU}
    mem_limit: ${WATCHDOG_MEM}
    restart: unless-stopped
    env_file: .env
    entrypoint:
    - python
    - scripts/heartbeat_monitor.py
    networks:
    - trading-net
volumes:
  engine-data:
    driver: local
  ml-models:
    driver: local
  screener-data:
    driver: local
networks:
  trading-net:
    driver: bridge
