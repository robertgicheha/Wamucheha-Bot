# Crypto + gold trading bot: two services.
#   engine     the trading loop (DRY-RUN unless LIVE_TRADING=true in .env)
#   dashboard  the admin console at http://127.0.0.1:8000/admin
#
# Gold note: spot gold (XAUUSD) trades through the MetaTrader 5 terminal, which only
# runs on Windows, so inside this Linux container the bot trades crypto plus the
# tokenised gold pair PAXG/USDT (see config/config.yaml). To trade XAUUSD via MT5,
# run the engine natively on Windows: `python main.py` (or the dashboard's Start button).
#
# Start:   docker compose up -d --build
# Logs:    docker compose logs -f engine
# Stop:    docker compose down
services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: trading-engine
    cpus: ${ENGINE_CPU:-1.0}
    mem_limit: ${ENGINE_MEM:-1g}
    restart: unless-stopped
    env_file: .env
    volumes:
    - ./config:/app/config:ro
    - engine-data:/app/data
    - engine-control:/app/data/control   # dashboard -> engine command mailbox
    environment:
      PYTHONUNBUFFERED: '1'
      DISABLE_VENUES: ""      # Docker has no MT5, so keep the simulated OKX crypto here
    networks:
    - trading-net
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import json,time,sys; d=json.load(open('/app/data/engine_heartbeat.json')); from datetime import datetime,timezone; age=(datetime.now(timezone.utc)-datetime.fromisoformat(d['ts'])).total_seconds(); sys.exit(0 if age<300 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: trading-dashboard
    cpus: ${DASH_CPU:-0.5}
    mem_limit: ${DASH_MEM:-512m}
    restart: unless-stopped
    env_file: .env
    ports:
    - ${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8000}:8000   # DASHBOARD_BIND=0.0.0.0 to reach it from your phone on the same Wi-Fi
    volumes:
    - engine-data:/app/data:ro
    - engine-control:/app/data/control   # writable: the only place the dashboard can write
    - ./config:/app/config:ro
    environment:
      DISABLE_VENUES: ""
    networks:
    - trading-net
    depends_on:
    - engine
volumes:
  engine-data:
    driver: local
  engine-control:
    driver: local
networks:
  trading-net:
    driver: bridge
