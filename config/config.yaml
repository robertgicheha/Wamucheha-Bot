# All risk parameters live here so you never have to touch code to change them.

account:
  stake_amount: 10.0           # overridden by STAKE_AMOUNT env var if set
  trading_balance: 100.0       # capital the bot may trade; seeds a fresh state DB only
                               # (overridden by TRADING_BALANCE env var)
  currency: USD
  stake_wallet_address: ""     # cold wallet / separate account, bot has no access

risk:
  max_consecutive_losses: 8          # hard stop, per your spec
  max_daily_loss_pct: 5              # % of trading_balance; drawdown limit < 5%
  max_drawdown_pct: 5                # peak-to-trough drawdown halt limit
  max_position_pct: 2                # % of trading_balance risked on any single trade
  stop_loss_pct: 1.5                 # per-trade stop loss, always attached at order time
  take_profit_pct: 3.0               # optional per-trade target
  profit_withdrawal_threshold: 500   # when trading_balance hits this, sweep excess to stake wallet
  profit_withdrawal_keep: 200        # amount left in trading_balance after a sweep
  volatility_circuit_breaker_pct: 3  # pause trading if price moves this % in the window below
  volatility_window_minutes: 5
  trailing_stop_activate_pct: 1.5    # start trailing once a position is up this much
  trailing_stop_distance_pct: 1.0    # trail this far behind the peak price once activated
  max_open_positions: 12             # absolute cap on simultaneous open trades
  max_asset_class_exposure_pct: 30   # max % of trading_balance exposed to any single asset class
  max_correlated_positions: 3        # max positions in the same correlation group (e.g. BTC+ETH+...)
  # Max % of trading_balance exposed to a single venue, so one exchange
  # freezing, freezing withdrawals, or being hacked cannot take everything.
  # Measured on open-position notional, not margin.
  max_venue_exposure_pct: 40
  # --- MT5 bridge guards ---
  # Enforced on the Windows side by the executor, independently of the engine,
  # so a compromised or malfunctioning engine still cannot place a runaway
  # order. Sized well above normal operation: these exist to catch a fault,
  # not to interfere with a signal. 0 = that particular guard is off.
  mt5_max_lot: 1.0             # absolute ceiling on any single MT5 order
  mt5_max_open_trades: 4      # concurrent MT5 positions
  mt5_max_daily_loss_pct: 4   # daily loss halt, independent of the engine's
  reconciliation_interval_seconds: 300  # how often to reconcile exchange balances with tracked state

execution:
  # Venue layout. Every venue holds its OWN balance and has its OWN deposit
  # address — they are never "funded by" each other. The cold/stake wallet
  # (account.stake_wallet_address) is the treasury above them: you send USDT
  # from it to a venue's deposit address, and withdraw profits back to it.
  # Per-venue funding amounts are yours to set on the exchange side; the bot
  # never moves funds and is never given withdrawal permission.
  # Full per-venue checklist, network fees and the pre-flight go-live steps:
  #   docs/FUNDING.md
  # A venue listed here with enabled:false gets NO executor at all, which is
  # what stops it trading even when its env keys point at a live endpoint.
  # Before flipping LIVE_TRADING=true run: python scripts/preflight.py
  #
  # Symbol selection is by LIQUIDITY, not unit price. A coin's price per unit
  # has nothing to do with how expensive it is to trade — you can buy
  # fractions, and a 5% move earns the same % whatever the price. What matters
  # is 24h volume, spread, and that volatility comfortably exceeds
  # fees + spread. Thin pairs (QNT) are added last and capped.
  exchanges:
    - name: binance
      enabled: true
      markets: ["ETH/USDT", "SOL/USDT", "XRP/USDT", "LINK/USDT"]
    - name: okx
      enabled: true
      markets: ["ETH/USDT", "SOL/USDT"]
    # Bybit needs no new code: the name is already whitelisted in the executor
    # (main.py), the market-data router (data_feeds/feed_router.py) and the
    # always-open crypto set (core/market_hours.py), and it resolves through
    # the same generic ccxt ExecutionManager as Binance and OKX. It reads
    # BYBIT_API_KEY / BYBIT_API_SECRET from .env.
    - name: bybit
      enabled: true
      markets: ["ETH/USDT", "SOL/USDT"]
    # OANDA overlaps MT5 on both forex and metals. One venue for both keeps
    # margin and risk in one place. Left disabled; re-enable only if you
    # deliberately want a second forex venue.
    - name: oanda
      enabled: false
      markets: []
    # US equities stay off until you confirm your Alpaca account type is
    # available to Kenyan residents.
    - name: alpaca
      enabled: false
      markets: []
    - name: mt5
      enabled: true
      markets: []
  # MT5 carries forex AND metals, so all your non-crypto risk is sized in one
  # place against one broker's margin. BTCUSD is left out on purpose: the same
  # exposure is available as a spot pair on Binance/OKX with real volume, and
  # a CFD price feed adds spread for no diversification.
  # Silver (XAGUSD) is commented out until the broker is confirmed to offer it.
  oanda_markets:
    - "GBP/USD"
    - "EUR/USD"
    - "AUD/USD"
    - "EUR/JPY"
    - "EUR/GBP"
    - "USD/CAD"
    - "USD/JPY"
    - "GBP/JPY"
  mt5_markets:
    - "XAUUSD"
    - "EURUSD"
    - "GBPUSD"
    - "AUDUSD"
    - "EURJPY"
    - "EURGBP"
    - "USDCAD"
    # - "XAGUSD"     # silver — uncomment once the broker lists it
    # - "BTCUSD"    # crypto CFD — prefer spot on Binance/OKX (deeper book)
  alpaca_markets: ["AAPL", "MSFT", "SPY", "QQQ", "GLD", "TLT"]
  # MT5's minimum order is 0.01 lot (~$1,000 EURUSD, ~$4,000 gold) — far above
  # max_position_pct of a small trading balance. false: skip such trades.
  # true: trade the minimum lot anyway (only sensible on a demo account).
  mt5_allow_min_lot: false
  order_type: market            # market | limit
  max_slippage_pct: 0.5
  idempotency: true              # attach client order IDs, dedupe on retry

strategy:
  # --- Indicator Parameters ---
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  volume_spike_threshold: 1.5
  # Minimum weighted ensemble score (0..1 scale, NOT "out of 5") to trigger
  # entry. Calibrated against real BTC/ETH/SOL 15m score distributions —
  # the weighted sum of per-strategy scores rarely exceeds ~0.35 even when
  # several strategies agree, so a naive "3 out of 5" (0.6) threshold is
  # unreachable and silently produces zero trades. 0.18 sits near the 95th
  # percentile of observed scores: selective, but not unreachable.
  min_signal_score: 0.18
  min_aggregator_confidence: 0.25   # SignalAggregator conflict-veto gate (0..1)
  # Bars after entry before trend-reversal/MACD-cross/channel-break exits can
  # fire. Without this, a position entered on e.g. an EMA crossover gets
  # closed by the same crossover flipping back on ordinary 1-bar noise —
  # measured on real data, this was closing nearly every trade within a few
  # bars at a small loss before the fixed stop-loss/take-profit ever mattered.
  # The fixed stop-loss stays active immediately regardless of this gate.
  min_bars_before_signal_exit: 2
  enable_shorts: true

  # --- Trend-Following ---
  donchian_period: 20            # Donchian channel lookback (turtle trading)
  adx_threshold: 25              # ADX must exceed this for ADX-filtered entries

  # --- Mean Reversion ---
  zscore_period: 20              # Z-score rolling window
  zscore_entry_threshold: 2.0    # z-score extreme to trigger entry
  zscore_exit_threshold: 0.5     # z-score returning toward zero

  # --- Breakout ---
  opening_range_period: 20       # Number of bars for opening range definition
  atr_expansion_threshold: 1.5   # ATR must be this ratio vs SMA(ATR) to signal expansion

  # --- Market Making ---
  spread_capture_bb_width_max: 0.03  # Bollinger width ceiling for spread capture mode
  spread_capture_atr_pct_max: 2.0    # ATR% ceiling for low-vol detection

  # --- Options ---
  implied_vol_high_threshold: 0.30   # IV above this = covered call opportunity
  implied_vol_low_threshold: 0.15    # IV below this = straddle opportunity

  # --- Portfolio Strategies ---
  dca_base_amount: 100.0             # Base DCA buy amount in USD
  dca_volatility_sizing: true        # Scale DCA size inversely with volatility
  safe_haven_drawdown_threshold: -5.0  # Equity drawdown % to trigger gold rotation
  rebalance_lookback_period: 20      # Bars for portfolio rotation ranking
  rebalance_sharpe_threshold: 0.6    # Minimum Sharpe for overweight candidates

  # --- Arbitrage ---
  cross_exchange_min_spread_pct: 0.3  # Min spread % for cross-exchange arb
  triangular_min_profit_pct: 0.1      # Min profit % for triangular arb

  # --- Individual strategy weights in the 20-strategy ensemble ---
  # Weights are normalized and adapted automatically by market regime
  weights:
    # Trend-Following (6 strategies)
    ema_crossover: 0.08
    macd: 0.07
    ichimoku: 0.06
    supertrend: 0.07
    donchian: 0.04
    adx_filtered: 0.03
    # Mean Reversion (4 strategies)
    bollinger: 0.05
    rsi_divergence: 0.05
    vwap_reversion: 0.04
    zscore_reversion: 0.04
    # Momentum (1 strategy)
    momentum: 0.07
    # Breakout (3 strategies)
    keltner_breakout: 0.05
    opening_range_breakout: 0.04
    atr_volatility_breakout: 0.04
    # Market Making (1 strategy)
    spread_capture: 0.03
    # Scalping (1 strategy)
    scalping: 0.03
    # News/Sentiment (1 strategy)
    sentiment: 0.06
    # ML/Statistical (2 strategies)
    ml_prediction: 0.10
    volatility_forecast: 0.05

ml:
  use_lstm: false                 # enable/disable LSTM filter on signals
  lstm_min_confidence: 0.6       # minimum probability from LSTM to allow a trade
  lstm_model_type: pytorch       # pytorch | tensorflow
  auto_retrain_hours: 168        # retrain models every 7 days
  min_train_samples: 500         # minimum OHLCV bars needed to train

intelligence:
  fear_greed_enabled: true       # use Fear & Greed index as market regime filter
  dxy_enabled: true              # use Dollar Index for forex correlation
  correlation_lookback: 20       # bars for cross-asset correlation
  news_sentiment_enabled: true   # use news sentiment as additional filter

long_term:
  # Free by default: US/ETF data+fundamentals via yfinance (no key/signup),
  # NSE prices via RapidAPI NSE_RAPIDAPI_KEY (optional, gives the whole
  # exchange in one request) with a free afx.kwayisi.org fallback, and NSE
  # fundamentals via afx.kwayisi.org — RapidAPI's /stocks endpoint returns no
  # P/E, EPS or dividend data. FMP/Alpha Vantage keys in .env are optional
  # richer fallbacks, not required.
  universe:
    us_stocks: ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "META", "JNJ", "KO",
                "PG", "V", "JPM", "XOM", "WMT", "HD", "UNH", "PEP", "AVGO"]
    etfs: ["SPY", "QQQ", "VOO", "VTI", "GLD", "SCHD", "VYM"]
    # Verified against the live afx.kwayisi.org/nse/ listed-companies table.
    nse_kenya: ["SCOM", "EQTY", "KCB", "EABL", "BAT", "COOP", "ABSA", "SCBK",
                "NCBA", "DTK", "BAMB", "JUB", "KEGN", "KPLC", "BRIT", "SASN",
                "CTUM", "NMG", "UMME", "IMH"]
  screens:
    min_dividend_years_growth: 5
    max_payout_ratio: 70
    min_market_cap_usd: 500000000
  sell_review:
    trend_drop_pct: 8          # flag "consider selling" if price fell at least this much...
    lookback_days: 5           # ...over this many trading days
  gainers_losers_top_n: 8
  rebalance_alert_schedule: "0 8 * * MON"    # cron: weekly deep fundamentals screen, Monday 8am UTC
  daily_digest_schedule: "30 5 * * *"        # cron: daily buy/sell/gainers/losers digest, 05:30 UTC (~08:30 EAT, before NSE's 09:30 EAT open)
  dashboard_refresh_interval_minutes: 60     # how often the dashboard's long-term cache refreshes (price/gainers-losers only, no fundamentals calls)

nse:
  watchlist: ["SCOM", "EQTY", "KCB", "BAT", "EABL", "DTK",
              "COOP", "ABSA", "SCBK", "NCBA"]
  analysis_interval_minutes: 60   # how often to check NSE stocks for alerts

  # --- Exchange-wide daily snapshot (RapidAPI) ---
  # NSE trades 09:00-15:00 EAT, so 16:00 EAT is after the close. This trigger is
  # pinned to Africa/Nairobi in long_term/scheduler.py, so it does not depend on
  # the host clock. It is the ONLY job permitted to call RapidAPI: the Basic plan
  # allows 4 requests/hour and 250/month, and this costs ~22 calls/month.
  snapshot_schedule: "0 16 * * MON-FRI"
  misfire_grace_minutes: 180       # if the process was down at 16:00, still take the close
  fundamentals_max_workers: 4      # threads hitting the free afx.kwayisi.org site for P/E etc.

alerts:
  channels: [telegram, discord, email, dashboard]
  # NOTE: this block is not read by the code. Per-event channel routing lives in
  # code — see EMAIL_ALLOWED_EVENTS in alerts/notifier.py, which decides the only
  # event type that reaches email (the daily investing digest). Everything else
  # is Telegram/Discord only.
  notify_on:
    - trade_opened
    - trade_closed
    - circuit_breaker_triggered
    - daily_loss_limit_hit
    - profit_swept_to_stake
    - heartbeat_missed
    - long_term_signal
    - long_term_daily_digest
    - nse_alert
    - market_regime_change
    - hourly_summary
