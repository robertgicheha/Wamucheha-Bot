# NSE dividends. Neither the Sokowatch feed nor Yahoo Finance supplies NSE dividend data,
# so only what you enter here is shown. Take figures from the company's own announcement.
# dividend_per_share is the total for the last 12 months in KES; the yield is worked out
# from the live price. Format:
#
#   nse_dividends:
#     SYMBOL:
#       dividend_per_share: 0.00
#       book_closure: "YYYY-MM-DD"   # optional
#       note: "where the figure came from"   # optional
nse_dividends: {}
