# Reverse proxy for the public dashboard.
#
# Terminates TLS, enforces HTTP Basic Auth, and forwards to the dashboard
# container on loopback. Nothing in the container should ever be published
# directly to 0.0.0.0 -- keep the compose port binding on 127.0.0.1.
#
# Install:
#   htpasswd -B -c /etc/nginx/dashboard.htpasswd <user>
#   cp deploy/nginx-dashboard.conf /etc/nginx/sites-available/dashboard
#   ln -sf /etc/nginx/sites-available/dashboard /etc/nginx/sites-enabled/dashboard
#   nginx -t && systemctl reload nginx
#
# TLS is issued separately by certbot (--nginx -d <domain>), which rewrites
# this file to add the certificate paths and the HTTP->HTTPS redirect.

# The map/upstream blocks live in deploy/nginx-dashboard-upstream.conf because
# they are http-context directives and cannot appear in a server block.

server {
    listen 80;
    listen [::]:80;
    server_name wamucheha-bot.duckdns.org;

    # Keep the ACME HTTP-01 challenge reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is deliberately OFF. Browsers use RFC 8441 extended CONNECT for
    # wss:// once they negotiate h2, and nginx 1.24 cannot proxy that to
    # uvicorn -- /ws returns 404 over h2 while returning 101 over HTTP/1.1.
    # That silently kills the live price feed, so HTTP/1.1 only until nginx is
    # new enough (>= 1.25.1) to forward extended CONNECT.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wamucheha-bot.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/wamucheha-bot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wamucheha-bot.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Auth on every path, including the WebSocket handshake.
    auth_basic           "Wamucheha Bot";
    auth_basic_user_file /etc/nginx/dashboard.htpasswd;

    # Dashboard ships event streams; do not buffer or time them out.
    proxy_buffering      off;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "no-referrer" always;

    location / {
        proxy_pass         http://wamucheha_dashboard;
        proxy_http_version 1.1;

        # WebSocket support for /ws
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
