# http-context helpers for the dashboard proxy.
#
# `map` and `upstream` are only valid in the http context, so they cannot live
# in the server-block file. On Ubuntu, /etc/nginx/conf.d/*.conf is included
# from within http, which makes this the right home for them.
#
# Install:
#   cp deploy/nginx-dashboard-upstream.conf /etc/nginx/conf.d/dashboard-upstream.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wamucheha_dashboard {
    server 127.0.0.1:8000;
    keepalive 16;
}
