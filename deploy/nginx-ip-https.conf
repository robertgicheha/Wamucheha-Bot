# Reverse proxy for the public dashboard (direct IP with SSL)
server {
    listen 80;
    listen [::]:80;
    server_name 158.220.80.54 wamucheha.work.gd www.wamucheha.work.gd;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://\System.Management.Automation.Internal.Host.InternalHost;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 158.220.80.54 wamucheha.work.gd www.wamucheha.work.gd;

    ssl_certificate     /etc/letsencrypt/live/wamucheha.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wamucheha.work.gd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    ;
        proxy_set_header Connection ;
        proxy_set_header Host              \System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP         ;
        proxy_set_header X-Forwarded-For   ;
        proxy_set_header X-Forwarded-Proto ;
    }
}
